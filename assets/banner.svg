<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" fill="url(#bg)"/>

  <!-- Subtle Grid Pattern -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.35">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="220" x2="1200" y2="220"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="340" x2="1200" y2="340"/>
    <line x1="100" y1="0" x2="100" y2="380"/>
    <line x1="250" y1="0" x2="250" y2="380"/>
    <line x1="400" y1="0" x2="400" y2="380"/>
    <line x1="550" y1="0" x2="550" y2="380"/>
    <line x1="700" y1="0" x2="700" y2="380"/>
    <line x1="850" y1="0" x2="850" y2="380"/>
    <line x1="1000" y1="0" x2="1000" y2="380"/>
  </g>

  <!-- Glowing Shield Graphic on the Right -->
  <g transform="translate(930, 190)">
    <circle cx="0" cy="0" r="110" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
    <path d="M 0 -85 L 65 -45 L 65 30 C 65 75 0 100 0 100 C 0 100 -65 75 -65 30 L -65 -45 Z" 
          fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="3" filter="url(#glow)"/>
    <!-- Circuit lines inside shield -->
    <circle cx="0" cy="-20" r="8" fill="#38bdf8"/>
    <circle cx="-30" cy="20" r="6" fill="#818cf8"/>
    <circle cx="30" cy="20" r="6" fill="#818cf8"/>
    <circle cx="0" cy="45" r="7" fill="#c084fc"/>
    <line x1="0" y1="-20" x2="-30" y2="20" stroke="#38bdf8" stroke-width="2"/>
    <line x1="0" y1="-20" x2="30" y2="20" stroke="#38bdf8" stroke-width="2"/>
    <line x1="-30" y1="20" x2="0" y2="45" stroke="#818cf8" stroke-width="2"/>
    <line x1="30" y1="20" x2="0" y2="45" stroke="#818cf8" stroke-width="2"/>
  </g>

  <!-- Pill Badge -->
  <g transform="translate(80, 60)">
    <rect width="320" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9"/>
    <circle cx="20" cy="17" r="5" fill="#10b981"/>
    <text x="35" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="1">
      PRODUCTION AI SECURITY AUDIT
    </text>
  </g>

  <!-- Main Title -->
  <text x="80" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="url(#accent)" letter-spacing="-1">
    AI SECURITY AUDIT
  </text>

  <!-- Subtitle -->
  <text x="80" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
    Defensive Code Auditing · Adversarial Red-Teaming · Vector &amp; RAG Hardening · Shadow APIs
  </text>

  <!-- Taxonomy Badges Row -->
  <g transform="translate(80, 240)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="185" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="15" y="21" font-family="monospace" font-size="13" fill="#38bdf8" font-weight="600">OWASP LLM 2025</text>

    <!-- Badge 2 -->
    <rect x="200" y="0" width="185" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="215" y="21" font-family="monospace" font-size="13" fill="#818cf8" font-weight="600">AGENTIC ASI01-10</text>

    <!-- Badge 3 -->
    <rect x="400" y="0" width="165" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="415" y="21" font-family="monospace" font-size="13" fill="#c084fc" font-weight="600">RAG &amp; VECTOR DB</text>

    <!-- Badge 4 -->
    <rect x="580" y="0" width="165" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="595" y="21" font-family="monospace" font-size="13" fill="#f43f5e" font-weight="600">SHADOW API INVENTORY</text>
  </g>

  <!-- Bottom Details -->
  <text x="80" y="325" font-family="monospace" font-size="14" fill="#64748b">
    Author: faizyoshio · License: Apache-2.0 · Universal Agent Skill (/ai-security-audit)
  </text>
</svg>
