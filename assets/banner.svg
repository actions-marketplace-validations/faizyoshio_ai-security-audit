<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="20%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="85%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Shield & Accent Gradients -->
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="shieldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Badge Background -->
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#cyanGlow)"/>
  <rect width="1200" height="420" fill="url(#purpleGlow)"/>

  <!-- Modern Subtle Grid Pattern -->
  <g stroke="#334155" stroke-width="0.8" opacity="0.22">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="120" y1="0" x2="120" y2="420"/>
    <line x1="280" y1="0" x2="280" y2="420"/>
    <line x1="440" y1="0" x2="440" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="760" y1="0" x2="760" y2="420"/>
    <line x1="920" y1="0" x2="920" y2="420"/>
    <line x1="1080" y1="0" x2="1080" y2="420"/>
  </g>

  <!-- Outer Card Frame Border -->
  <rect x="2" y="2" width="1196" height="416" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Pill / Status Tag -->
  <g transform="translate(80, 52)">
    <rect width="330" height="36" rx="18" fill="url(#badgeBg)" stroke="#0ea5e9" stroke-width="1.2"/>
    <circle cx="20" cy="18" r="5" fill="#10b981"/>
    <text x="36" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1.2">
      ENTERPRISE AI SECURITY AUDIT
    </text>
  </g>

  <!-- Main Hero Title -->
  <text x="80" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="56" font-weight="900" fill="url(#textGrad)" letter-spacing="-1">
    AI SECURITY AUDIT
  </text>

  <!-- Subtitle with crisp, clear contrast -->
  <text x="80" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="20" font-weight="500" fill="#e2e8f0" letter-spacing="0.2">
    Defensive Code Auditing · Adversarial Red-Teaming · RAG Hardening · Shadow APIs
  </text>

  <!-- High-Legibility Pill Badges Row -->
  <g transform="translate(80, 246)">
    <!-- Badge 1: OWASP LLM 2025 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="40" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.2"/>
      <circle cx="20" cy="20" r="4.5" fill="#0ea5e9"/>
      <text x="34" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">
        OWASP LLM 2025
      </text>
    </g>

    <!-- Badge 2: AGENTIC ASI01-10 -->
    <g transform="translate(195, 0)">
      <rect width="190" height="40" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.2"/>
      <circle cx="20" cy="20" r="4.5" fill="#818cf8"/>
      <text x="34" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">
        AGENTIC ASI01-10
      </text>
    </g>

    <!-- Badge 3: RAG & VECTOR DB -->
    <g transform="translate(400, 0)">
      <rect width="175" height="40" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.2"/>
      <circle cx="20" cy="20" r="4.5" fill="#c084fc"/>
      <text x="34" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">
        RAG &amp; VECTOR DB
      </text>
    </g>

    <!-- Badge 4: SHADOW APIS -->
    <g transform="translate(590, 0)">
      <rect width="165" height="40" rx="8" fill="#0f172a" stroke="#f43f5e" stroke-width="1.2"/>
      <circle cx="20" cy="20" r="4.5" fill="#f43f5e"/>
      <text x="34" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">
        SHADOW APIS
      </text>
    </g>
  </g>

  <!-- Clean, Balanced Bottom Info Strip -->
  <g transform="translate(80, 345)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="500" fill="#94a3b8">
      Created by <tspan font-weight="700" fill="#38bdf8">faizyoshio</tspan> · Apache-2.0 License · Slash Command: <tspan font-family="monospace" font-weight="700" fill="#a78bfa">/ai-security-audit</tspan>
    </text>
  </g>

  <!-- Right Geometric Emblem (Precision Hex-Shield & AI Neural Core) -->
  <g transform="translate(980, 205)">
    <!-- Ambient Radial Halo -->
    <circle cx="0" cy="0" r="115" fill="#6366f1" opacity="0.12" filter="url(#softGlow)"/>

    <!-- Outer Geometric Hex-Shield -->
    <polygon points="0,-105 85,-55 85,55 0,105 -85,55 -85,-55"
             fill="url(#shieldFill)" stroke="url(#shieldStroke)" stroke-width="2.5" filter="url(#softGlow)"/>

    <!-- Inner Core Shield -->
    <polygon points="0,-75 60,-40 60,40 0,75 -60,40 -60,-40"
             fill="#0b1329" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>

    <!-- Neural Topology Network -->
    <!-- Nodes -->
    <circle cx="0" cy="-35" r="7" fill="#38bdf8"/>
    <circle cx="-32" cy="18" r="6" fill="#818cf8"/>
    <circle cx="32" cy="18" r="6" fill="#818cf8"/>
    <circle cx="0" cy="42" r="7" fill="#c084fc"/>

    <!-- Glowing Core Center -->
    <circle cx="0" cy="5" r="9" fill="#f43f5e" filter="url(#softGlow)"/>

    <!-- Interconnecting Circuit Beams -->
    <line x1="0" y1="-35" x2="0" y2="5" stroke="#38bdf8" stroke-width="2"/>
    <line x1="-32" y1="18" x2="0" y2="5" stroke="#818cf8" stroke-width="2"/>
    <line x1="32" y1="18" x2="0" y2="5" stroke="#818cf8" stroke-width="2"/>
    <line x1="0" y1="42" x2="0" y2="5" stroke="#c084fc" stroke-width="2"/>
    <line x1="-32" y1="18" x2="0" y2="42" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="32" y1="18" x2="0" y2="42" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="0" y1="-35" x2="-32" y2="18" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="0" y1="-35" x2="32" y2="18" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>
</svg>
