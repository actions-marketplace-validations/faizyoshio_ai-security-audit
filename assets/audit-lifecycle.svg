<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 150" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .phase-num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
    .phase-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; font-size: 13.5px; font-weight: 700; fill: #f8fafc; }
    .phase-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; font-size: 11.5px; font-weight: 500; fill: #94a3b8; }
    .arrow { stroke: #475569; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .arrow-head { fill: #475569; }
  </style>

  <!-- Background Canvas -->
  <rect width="1140" height="150" rx="14" fill="#070a13" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Phase 1: Recon & Shadow APIs -->
  <g transform="translate(20, 20)">
    <rect width="155" height="110" rx="10" fill="url(#bgBox)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="155" height="4" rx="2" fill="#38bdf8"/>
    <text x="14" y="28" class="phase-num" fill="#38bdf8">PHASE 01</text>
    <text x="14" y="52" class="phase-title">Recon &amp; APIs</text>
    <text x="14" y="74" class="phase-sub">Shadow Routes</text>
    <text x="14" y="92" class="phase-sub">Spec Diffing</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(182, 75)">
    <line x1="0" y1="0" x2="16" y2="0" class="arrow"/>
    <polygon points="16,-4 24,0 16,4" class="arrow-head"/>
  </g>

  <!-- Phase 2: Vector & RAG Audit -->
  <g transform="translate(210, 20)">
    <rect width="155" height="110" rx="10" fill="url(#bgBox)" stroke="#818cf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="155" height="4" rx="2" fill="#818cf8"/>
    <text x="14" y="28" class="phase-num" fill="#818cf8">PHASE 02</text>
    <text x="14" y="52" class="phase-title">Vector &amp; RAG</text>
    <text x="14" y="74" class="phase-sub">DB Port Exposure</text>
    <text x="14" y="92" class="phase-sub">Corpus Poisoning</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(372, 75)">
    <line x1="0" y1="0" x2="16" y2="0" class="arrow"/>
    <polygon points="16,-4 24,0 16,4" class="arrow-head"/>
  </g>

  <!-- Phase 3: Adversarial Prompts -->
  <g transform="translate(400, 20)">
    <rect width="155" height="110" rx="10" fill="url(#bgBox)" stroke="#c084fc" stroke-width="1.5"/>
    <rect x="0" y="0" width="155" height="4" rx="2" fill="#c084fc"/>
    <text x="14" y="28" class="phase-num" fill="#c084fc">PHASE 03</text>
    <text x="14" y="52" class="phase-title">Prompt Attacks</text>
    <text x="14" y="74" class="phase-sub">Direct &amp; Indirect</text>
    <text x="14" y="92" class="phase-sub">Token Smuggling</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <g transform="translate(562, 75)">
    <line x1="0" y1="0" x2="16" y2="0" class="arrow"/>
    <polygon points="16,-4 24,0 16,4" class="arrow-head"/>
  </g>

  <!-- Phase 4: Agentic Tools & HITL -->
  <g transform="translate(590, 20)">
    <rect width="155" height="110" rx="10" fill="url(#bgBox)" stroke="#f472b6" stroke-width="1.5"/>
    <rect x="0" y="0" width="155" height="4" rx="2" fill="#f472b6"/>
    <text x="14" y="28" class="phase-num" fill="#f472b6">PHASE 04</text>
    <text x="14" y="52" class="phase-title">Agentic Tools</text>
    <text x="14" y="74" class="phase-sub">Confused Deputy</text>
    <text x="14" y="92" class="phase-sub">HITL Binding</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <g transform="translate(752, 75)">
    <line x1="0" y1="0" x2="16" y2="0" class="arrow"/>
    <polygon points="16,-4 24,0 16,4" class="arrow-head"/>
  </g>

  <!-- Phase 5: Downstream Sinks -->
  <g transform="translate(780, 20)">
    <rect width="155" height="110" rx="10" fill="url(#bgBox)" stroke="#fb923c" stroke-width="1.5"/>
    <rect x="0" y="0" width="155" height="4" rx="2" fill="#fb923c"/>
    <text x="14" y="28" class="phase-num" fill="#fb923c">PHASE 05</text>
    <text x="14" y="52" class="phase-title">Downstream Sinks</text>
    <text x="14" y="74" class="phase-sub">AI Stored XSS</text>
    <text x="14" y="92" class="phase-sub">SQL / Shell Taint</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <g transform="translate(942, 75)">
    <line x1="0" y1="0" x2="16" y2="0" class="arrow"/>
    <polygon points="16,-4 24,0 16,4" class="arrow-head"/>
  </g>

  <!-- Phase 6: Chained Remediation -->
  <g transform="translate(970, 20)">
    <rect width="150" height="110" rx="10" fill="url(#bgBox)" stroke="#34d399" stroke-width="1.5"/>
    <rect x="0" y="0" width="150" height="4" rx="2" fill="#34d399"/>
    <text x="14" y="28" class="phase-num" fill="#34d399">PHASE 06</text>
    <text x="14" y="52" class="phase-title">Remediation</text>
    <text x="14" y="74" class="phase-sub">Chained Impact</text>
    <text x="14" y="92" class="phase-sub">Code-Level Fixes</text>
  </g>
</svg>
