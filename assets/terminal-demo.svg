<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="titleBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <style>
    .t-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 13px; line-height: 1.6; }
    .prompt { fill: #38bdf8; font-weight: 700; }
    .cmd { fill: #f8fafc; font-weight: 600; }
    .info { fill: #94a3b8; }
    .warn { fill: #fbbf24; font-weight: 700; }
    .crit { fill: #f43f5e; font-weight: 800; }
    .success { fill: #34d399; font-weight: 700; }
    .dim { fill: #64748b; }
    
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor { animation: cursorBlink 1s infinite; fill: #38bdf8; }
  </style>

  <!-- Terminal Window Shadow & Frame -->
  <rect x="0" y="0" width="880" height="440" rx="12" fill="url(#termBg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title Bar -->
  <rect x="0" y="0" width="880" height="38" rx="12" fill="url(#titleBar)"/>
  <rect x="0" y="26" width="880" height="12" fill="url(#titleBar)"/>
  <line x1="0" y1="38" x2="880" y2="38" stroke="#1e293b" stroke-width="1"/>

  <!-- macOS Window Controls -->
  <circle cx="22" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="19" r="6" fill="#27c93f"/>

  <!-- Window Title -->
  <text x="440" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">
    faizyoshio@sec-audit: ~/ai-security-audit (zsh)
  </text>

  <!-- Terminal Body Content -->
  <g transform="translate(28, 68)" class="t-code">
    <!-- Command 1 -->
    <text x="0" y="0">
      <tspan class="prompt">faizyoshio@host</tspan><tspan class="dim">:</tspan><tspan class="prompt">~</tspan><tspan class="dim">$ </tspan>
      <tspan class="cmd">ai-sec-audit scan-vector --host 127.0.0.1</tspan>
    </text>

    <!-- Output 1 -->
    <text x="0" y="24" class="info">[*] Scanning vector database interfaces on: 127.0.0.1</text>
    <text x="0" y="46">
      <tspan class="crit">[!] PORT OPEN (8000)</tspan><tspan class="info"> Chroma DB  </tspan><tspan class="crit">-> [CRITICAL] Unauthenticated 200 at /api/v1/heartbeat</tspan>
    </text>
    <text x="0" y="68">
      <tspan class="dim">[-] Closed (6333)    </tspan><tspan class="info"> Qdrant REST</tspan>
    </text>
    <text x="0" y="90">
      <tspan class="dim">[-] Closed (8080)    </tspan><tspan class="info"> Weaviate REST</tspan>
    </text>

    <!-- Command 2 -->
    <text x="0" y="126">
      <tspan class="prompt">faizyoshio@host</tspan><tspan class="dim">:</tspan><tspan class="prompt">~</tspan><tspan class="dim">$ </tspan>
      <tspan class="cmd">ai-sec-audit redteam --url http://127.0.0.1:8088/api/v1/chat</tspan>
    </text>

    <!-- Output 2 -->
    <text x="0" y="150" class="info">[*] Fuzzing target endpoint with canary corpus (Run-Twice Verification Gate)...</text>
    <text x="0" y="172">
      <tspan class="warn">[*] Testing [role_override] ChatML System Role Break ...</tspan>
    </text>
    <text x="0" y="194">
      <tspan class="warn">    [!] Potential trigger detected on Run 1. Applying Gate 1 (Run-Twice)...</tspan>
    </text>
    <text x="0" y="216">
      <tspan class="crit">    [CRITICAL] CONFIRMED EXPLOIT: Canary echoed reproducibly across sessions!</tspan>
    </text>
    <text x="0" y="238">
      <tspan class="success">[+] Zero-confabulation finding recorded in findings.json</tspan>
    </text>

    <!-- Command 3: Auto Remediate -->
    <text x="0" y="274">
      <tspan class="prompt">faizyoshio@host</tspan><tspan class="dim">:</tspan><tspan class="prompt">~</tspan><tspan class="dim">$ </tspan>
      <tspan class="cmd">ai-sec-audit fix --file app/api.py --apply</tspan>
    </text>
    <text x="0" y="296">
      <tspan class="success">[+] Applied 2 auto-remediation patches to app/api.py</tspan>
    </text>

    <!-- Active Shell Cursor -->
    <text x="0" y="332">
      <tspan class="prompt">faizyoshio@host</tspan><tspan class="dim">:</tspan><tspan class="prompt">~</tspan><tspan class="dim">$ </tspan>
      <rect x="182" y="320" width="8" height="15" class="cursor"/>
    </text>
  </g>
</svg>
