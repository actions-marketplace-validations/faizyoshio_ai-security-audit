name: 'AI Security Audit'
description: 'Automated static security scanner, AST linter, and SARIF exporter for GenAI, RAG, and LLM codebases.'
author: 'faizyoshio'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  target-dir:
    description: 'Target codebase directory to inspect for AI security boundaries'
    required: false
    default: '.'
  check-vector-ports:
    description: 'Check for local unauthenticated vector database ports'
    required: false
    default: 'false'
  sarif-output:
    description: 'Path to export OASIS SARIF results for GitHub Code Scanning'
    required: false
    default: 'results.sarif'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Check Vector DB Perimeter
      if: inputs.check-vector-ports == 'true'
      shell: bash
      run: |
        python ${{ github.action_path }}/tools/scan_vector_ports.py --host 127.0.0.1

    - name: Run AST AI Security Linter
      shell: bash
      run: |
        echo "[*] Running AST security linter on ${{ inputs.target-dir }}..."
        python ${{ github.action_path }}/tools/lint_ai_code.py --dir ${{ inputs.target-dir }} --json > _linter_findings.json
        python ${{ github.action_path }}/tools/export_sarif.py --input _linter_findings.json --output ${{ inputs.sarif-output }}
        echo "[+] Exported Code Scanning SARIF to ${{ inputs.sarif-output }}"
