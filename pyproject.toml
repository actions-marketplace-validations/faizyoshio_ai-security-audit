[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-security-audit"
version = "1.0.0"
description = "Universal GenAI, RAG, and Agentic Security Auditing Engine"
readme = "README.md"
authors = [{ name = "faizyoshio" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/faizyoshio/ai-security-audit"
Repository = "https://github.com/faizyoshio/ai-security-audit"
Issues = "https://github.com/faizyoshio/ai-security-audit/issues"

[project.scripts]
ai-sec-audit = "ai_security_audit.cli:main"
